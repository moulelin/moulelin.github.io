<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>给她写纸条</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap">
<style>
:root { --bg: #fff7f3; --ink: #5a3e46; --muted: #a0848b; --pink: #ff7a9c; --pink2: #ffb3c6; --line: #f6dfe3; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); padding: 28px 16px 60px;
  font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; }
main { max-width: 560px; margin: 0 auto; }
h1 { font-weight: 400; font-size: 28px; margin: 0 0 4px; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 22px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: 0 14px 40px rgba(255,122,156,.1); }
textarea {
  width: 100%; min-height: 170px; resize: vertical; border: 0; outline: 0; color: var(--ink); padding: 0 2px;
  font-family: "Ma Shan Zheng", "ZCOOL KuaiLe", cursive; font-size: 22px; line-height: 42px;
  background: repeating-linear-gradient(transparent 0 41px, #f8dce3 41px 42px);
}
.row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.row label { color: var(--muted); font-size: 14px; }
.row input { width: 120px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--ink); outline: 0; }
.row .n { margin-left: auto; color: var(--muted); font-size: 13px; }
.send {
  display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 999px; padding: 12px; font-size: 18px;
  color: #fff; background: var(--pink); cursor: pointer; box-shadow: 0 4px 0 #f0607f;
}
.send:disabled { opacity: .55; cursor: default; }
.msg { text-align: center; min-height: 22px; margin: 10px 0 0; font-size: 15px; color: var(--pink); }
h2 { font-weight: 400; font-size: 20px; margin: 30px 0 10px; }
.note { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
.note p { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; font-family: "Ma Shan Zheng", cursive; font-size: 19px; line-height: 1.6; }
.meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.meta .st { padding: 1px 9px; border-radius: 999px; background: #f4eef0; }
.meta .st.read { background: #e4f6e4; color: #3f8f4f; }
.meta button { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
.empty { color: var(--muted); text-align: center; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>给她写一张纸条 💌</h1>
  <p class="sub">吉祥会叼着信封跑过去，她点一下吉祥就能看到</p>
  <div class="card">
    <textarea id="text" maxlength="400" placeholder="想对她说的话…"></textarea>
    <div class="row">
      <label for="from">署名</label><input id="from" maxlength="20">
      <span class="n" id="n">0 / 400</span>
    </div>
    <button type="button" class="send" id="send">交给吉祥 🐾</button>
    <p class="msg" id="msg"></p>
  </div>
  <h2>写过的纸条</h2>
  <div id="list"><p class="empty">加载中…</p></div>
</main>
<script>
(function () {
  var NOTES = 'https://fancy-9e6a8-default-rtdb.europe-west1.firebasedatabase.app/fancy/notes';
  var $ = function (s) { return document.querySelector(s); };
  var text = $('#text'), from = $('#from'), send = $('#send'), msg = $('#msg');
  try { from.value = localStorage.getItem('note-from') || 'Moral'; } catch (e) { from.value = 'Moral'; }
  function pad(n) { return String(n).padStart(2, '0'); }
  function when(ms) { var d = new Date(ms); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  text.addEventListener('input', function () { $('#n').textContent = text.value.length + ' / 400'; });

  function load() {
    fetch(NOTES + '.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) {
      var list = Object.keys(r || {}).map(function (id) { var n = r[id]; n.id = id; return n; })
        .filter(function (n) { return n && n.text; }).sort(function (a, b) { return b.at - a.at; });
      $('#list').innerHTML = list.length ? list.map(function (n) {
        return '<div class="note"><p>' + esc(n.text) + '</p><div class="meta"><span>' + when(n.at) + ' · ' + esc(n.from || '') + '</span>' +
          (n.readAt ? '<span class="st read">她看过了 · ' + when(n.readAt) + '</span>' : '<span class="st">还没看</span>') +
          '<button type="button" data-id="' + esc(n.id) + '">删除</button></div></div>';
      }).join('') : '<p class="empty">还没有写过纸条</p>';
    }).catch(function () { $('#list').innerHTML = '<p class="empty">加载失败了，刷新试试</p>'; });
  }
  send.addEventListener('click', function () {
    var t = text.value.trim();
    if (!t) { msg.textContent = '先写点什么吧'; return; }
    var f = from.value.trim() || 'Moral';
    try { localStorage.setItem('note-from', f); } catch (e) {}
    send.disabled = true; msg.textContent = '';
    fetch(NOTES + '.json', { method: 'POST', body: JSON.stringify({ text: t, from: f, at: Date.now() }) }).then(function (r) {
      if (!r.ok) throw new Error();
      text.value = ''; $('#n').textContent = '0 / 400';
      msg.textContent = '吉祥已经叼着纸条出发啦 🐾 她下次打开就能看到';
      load();
    }).catch(function () { msg.textContent = '没送出去，检查一下网络再试试'; })
      .then(function () { send.disabled = false; });
  });
  $('#list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]');
    if (!b || !confirm('删除这张纸条？她那边也会看不到了')) return;
    fetch(NOTES + '/' + encodeURIComponent(b.dataset.id) + '.json', { method: 'DELETE' }).then(load);
  });
  load();
})();
</script>
</body>
</html>
