<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>吉祥 · 测试</title>
</head>
<body style="font-family:sans-serif;color:#a0848b;text-align:center;padding-top:40vh">加载测试页面…
<script>
/* Test copy of her page: the real index.html with
   - the date moved to a day in December (?day=N),
   - her data read from the cloud but every write dropped,
   - storage kept in this tab only (sessionStorage), so nothing reaches her page. */
(function () {
  var q = location.search, day = Math.max(1, Math.min(31, +((q.match(/[?&]day=(\d+)/) || [])[1] || 1)));
  var SANDBOX = function (DAY) {
    // date: same time of day, but on Dec DAY
    var R = Date, now = new R(), t = new R(now.getFullYear(), 11, DAY, now.getHours(), now.getMinutes(), now.getSeconds());
    var off = t.getTime() - R.now();
    function D() { var a = [].slice.call(arguments); return a.length ? new (Function.prototype.bind.apply(R, [null].concat(a)))() : new R(R.now() + off); }
    D.now = function () { return R.now() + off; }; D.UTC = R.UTC; D.parse = R.parse; D.prototype = R.prototype;
    window.Date = D;
    // network: reads pass through, writes to Firebase / EmailJS are dropped
    var f = window.fetch;
    window.fetch = function (u, o) {
      var m = ((o && o.method) || 'GET').toUpperCase();
      if (/firebasedatabase|emailjs/.test(String(u)) && m !== 'GET')
        return Promise.resolve(new Response(JSON.stringify({ name: 'test' + R.now() }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      return f.apply(this, arguments);
    };
    // storage: an in-tab copy, so her page's saved progress on this device is untouched
    var KEY = 'fancy-test-store', mem = {};
    try { mem = JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) {}
    function save() { try { sessionStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
    var ls = {
      getItem: function (k) { return k in mem ? mem[k] : null; },
      setItem: function (k, v) { mem[k] = String(v); save(); },
      removeItem: function (k) { delete mem[k]; save(); },
      clear: function () { mem = {}; save(); },
      key: function (i) { return Object.keys(mem)[i] || null; },
      get length() { return Object.keys(mem).length; }
    };
    try { Object.defineProperty(window, 'localStorage', { value: ls, configurable: true }); } catch (e) {}
    if (navigator.serviceWorker) try { Object.defineProperty(navigator, 'serviceWorker', { value: undefined }); } catch (e) {}
  };
  var BAR = '<div id="testBar" style="position:fixed;left:8px;bottom:8px;z-index:9999;display:flex;gap:6px;align-items:center;' +
    'background:#5a3e46;color:#fff;border-radius:999px;padding:6px 10px;font:14px sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)">' +
    '🧪 测试 · 12 月 <b>' + day + '</b> 日' +
    '<button onclick="location.search=\'?day=' + Math.max(1, day - 1) + '\'" style="border:0;border-radius:999px;padding:3px 9px">‹</button>' +
    '<button onclick="location.search=\'?day=' + Math.min(31, day + 1) + '\'" style="border:0;border-radius:999px;padding:3px 9px">›</button>' +
    '<button onclick="sessionStorage.removeItem(\'fancy-test-store\');location.reload()" style="border:0;border-radius:999px;padding:3px 9px">重置</button></div>';
  fetch('index.html?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
    html = html.replace('<head>', '<head><meta name="robots" content="noindex, nofollow"><script>(' + SANDBOX + ')(' + day + ');<\/script>')
      .replace('<title>', '<title>🧪 ')
      .replace('</body>', BAR + '</body>');
    document.open(); document.write(html); document.close();
  });
})();
</script>
</body>
</html>
