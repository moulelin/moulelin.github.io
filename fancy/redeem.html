<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>核销兑换券</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root { --bg: #fff7f3; --ink: #5a3e46; --muted: #a0848b; --pink: #ff7a9c; --line: #f6dfe3; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); padding: 28px 16px 60px;
  font-family: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased;
}
main { max-width: 560px; margin: 0 auto; }
h1 { font-weight: 400; font-size: 28px; margin: 0 0 4px; text-align: center; }
.sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 22px; }
h2 { font-weight: 400; font-size: 20px; margin: 26px 0 10px; }
.c {
  display: flex; align-items: center; gap: 12px; background: #fff; border: 1.5px solid #ffd3de; border-radius: 16px;
  padding: 12px 14px; margin-bottom: 10px; background: linear-gradient(135deg, #fff8f0, #ffeef3);
}
.c .i { font-size: 34px; line-height: 1; }
.c .b { flex: 1; min-width: 0; }
.c b { display: block; font-weight: 400; font-size: 18px; }
.c p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.c button {
  border: 0; border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 15px; cursor: pointer;
  color: #fff; background: var(--pink); box-shadow: 0 3px 0 #f0607f; white-space: nowrap;
}
.c.used { background: #f7f3f4; border-color: var(--line); }
.c.used .i, .c.used .b { opacity: .55; filter: grayscale(.7); }
.c.used button { background: none; color: var(--muted); box-shadow: none; font-size: 13px; padding: 4px 6px; }
.empty { color: var(--muted); text-align: center; font-size: 14px; }
.msg { text-align: center; min-height: 22px; font-size: 15px; color: var(--pink); }
</style>
</head>
<body>
<main>
  <h1>核销兑换券 🎟️</h1>
  <p class="sub">她在圣诞抽奖日历里抽到的券都在这里，兑现以后点「核销」，她那边会显示「已兑换」</p>
  <p class="msg" id="msg"></p>
  <h2>还没兑换</h2>
  <div id="open"><p class="empty">加载中…</p></div>
  <h2>已经兑换</h2>
  <div id="used"></div>
</main>
<script>
(function () {
  var URL = 'https://fancy-9e6a8-default-rtdb.europe-west1.firebasedatabase.app/fancy/coupons';
  var $ = function (s) { return document.querySelector(s); };
  function pad(n) { return String(n).padStart(2, '0'); }
  function when(ms) { var d = new Date(ms); return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function card(c) {
    return '<div class="c' + (c.redeemedAt ? ' used' : '') + '" data-id="' + esc(c.id) + '"><span class="i">' + esc(c.icon || '🎟️') + '</span><div class="b"><b>' + esc(c.name) + '</b>' +
      '<p>' + esc(c.text || '') + '</p><p>' + (c.year || '') + ' 年 12 月 ' + c.day + ' 日的抽奖 · 抽到于 ' + when(c.at) +
      (c.redeemedAt ? ' · 已兑换 ' + when(c.redeemedAt) : '') + '</p></div>' +
      (c.redeemedAt ? '<button type="button" data-act="undo">撤销</button>' : '<button type="button" data-act="use">核销 ✓</button>') + '</div>';
  }
  function load() {
    fetch(URL + '.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) {
      var list = Object.keys(r || {}).map(function (id) { var c = r[id]; c.id = id; return c; })
        .filter(function (c) { return c && c.name; }).sort(function (a, b) { return (b.year - a.year) || (b.day - a.day); });
      var open = list.filter(function (c) { return !c.redeemedAt; }), used = list.filter(function (c) { return c.redeemedAt; });
      $('#open').innerHTML = open.length ? open.map(card).join('') : '<p class="empty">' + (list.length ? '全部兑换完啦 🎉' : '她还没有抽到兑换券') + '</p>';
      $('#used').innerHTML = used.length ? used.map(card).join('') : '<p class="empty">还没有兑换过</p>';
    }).catch(function () { $('#open').innerHTML = '<p class="empty">加载失败了，刷新试试</p>'; });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var c = b.closest('.c'), name = c.querySelector('b').textContent, use = b.dataset.act === 'use';
    if (!confirm(use ? '确认已经兑现「' + name + '」了吗？' : '撤销「' + name + '」的核销？')) return;
    b.disabled = true;
    fetch(URL + '/' + encodeURIComponent(c.dataset.id) + '.json', { method: 'PATCH', body: JSON.stringify({ redeemedAt: use ? Date.now() : null }) })
      .then(function (r) {
        if (!r.ok) throw new Error();
        $('#msg').textContent = use ? '核销好啦，「' + name + '」已兑换 ✓' : '已撤销';
        load();
      }).catch(function () { b.disabled = false; alert('没成功，检查一下网络再试试'); });
  });
  load();
})();
</script>
</body>
</html>
